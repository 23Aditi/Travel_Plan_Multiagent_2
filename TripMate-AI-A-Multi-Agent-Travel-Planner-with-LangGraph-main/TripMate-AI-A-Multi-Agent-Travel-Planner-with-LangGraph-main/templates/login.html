<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TripMate AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body class="auth-body">
    <div style="position: absolute; top: 20px; right: 20px;">
        <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
            <span id="themeIcon"></span>
        </button>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"></path>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <span class="brand-text">TripMate <span class="brand-badge">AI</span></span>
            </div>
            <h2>Welcome back</h2>
            <p>Sign in to continue planning your journeys</p>
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}
            <form action="/login" method="POST" class="auth-form">
                <div class="input-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-button">Sign In</button>
            </form>
            <div class="auth-footer">
                <p>New to TripMate AI? <a href="/register">Create an account</a></p>
            </div>
        </div>
    </div>
    <script src="/static/script.js?v=4"></script>
</body>
</html>
